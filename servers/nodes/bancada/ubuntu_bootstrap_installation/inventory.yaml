# ==============================================================================
# LPS / UFRJ - Inventário de Bancadas de Teste e Workstations
# Arquivo de configuração central para geração de Cloud-Init / Autoinstall
# ==============================================================================

common:
  # Dados de Rede do Laboratório
  gateway: "146.164.147.1"
  netmask: 24
  dns:
    - "146.164.147.2"
    - "8.8.8.8"
    - "8.8.4.4"
  domain: "lps.ufrj.br"

  # Usuário Administrador Local
  # Para gerar um novo hash de senha, execute: openssl passwd -6 "sua_senha"
  # O hash abaixo corresponde à senha padrão: cluster123
  admin_user: "cluster"
  admin_password_hash: "$6$rounds=4096$lpscluster$NZZXoZdV5gO3H37N1qLqZ1bU1Pz3J7w4o0R2M3n8Q1E9c5A7V4u2Y0k6B9z8X5v1T3w2Q5s7U0i4O1P3a5"
  admin_realname: "LPS Cluster Admin"
  
  # Chave pública SSH opcional para acesso direto sem senha (cole aqui sua id_rsa.pub)
  admin_ssh_keys: []
    # - "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... cluster@lps.ufrj.br"

  # Autenticação Centralizada (Kerberos & LDAP)
  kerberos_realm: "LPS.UFRJ.BR"
  kerberos_server: "auth-server.lps.ufrj.br"
  ldap_server_uri: "ldap://auth-server.lps.ufrj.br"
  ldap_base_dn: "dc=lps,dc=ufrj,dc=br"

  # Armazenamento em Rede (NFS)
  nfs_marketplace: "10.1.1.202:/volume1/market_place"
  nfs_projects: "10.1.1.204:/shares/projects"
  nfs_homes: "10.1.1.202:/volume1/homes"

# Lista de Bancadas (Workstations)
nodes:
  - hostname: "bancada01"
    ip: "146.164.147.201"
  - hostname: "bancada02"
    ip: "146.164.147.202"
  - hostname: "bancada03"
    ip: "146.164.147.203"
  - hostname: "bancada04"
    ip: "146.164.147.204"
  - hostname: "bancada05"
    ip: "146.164.147.205"
  - hostname: "bancada06"
    ip: "146.164.147.206"
  - hostname: "bancada07"
    ip: "146.164.147.207"
  - hostname: "bancada08"
    ip: "146.164.147.208"
  - hostname: "bancada09"
    ip: "146.164.147.209"
  - hostname: "bancada10"
    ip: "146.164.147.210"
