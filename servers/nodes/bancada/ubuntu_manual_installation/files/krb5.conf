[libdefaults]
    default_realm = LPS.UFRJ.BR
    dns_lookup_realm = false
    dns_lookup_kdc = true
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    LPS.UFRJ.BR = {
        kdc = auth-server.lps.ufrj.br
        admin_server = auth-server.lps.ufrj.br
    }

[domain_realm]
    .lps.ufrj.br = LPS.UFRJ.BR
    lps.ufrj.br = LPS.UFRJ.BR
