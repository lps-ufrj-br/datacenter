# ==============================================================================
# LPS / UFRJ - Configurações SSH para Nós de Bancada (OpenSSH 8.7+ / 9.x+)
# Arquivo drop-in para /etc/ssh/sshd_config.d/60-lps.conf
# ==============================================================================

# Autenticação Kerberos / GSSAPI
GSSAPIAuthentication yes
GSSAPICleanupCredentials yes
GSSAPIKeyExchange yes

# No OpenSSH 8.7+, ChallengeResponseAuthentication foi renomeado para KbdInteractiveAuthentication
KbdInteractiveAuthentication no

# Acesso Gráfico Remoto
X11Forwarding yes

# PAM e Variáveis de Ambiente
UsePAM yes
PrintMotd no
AcceptEnv LANG LC_*
